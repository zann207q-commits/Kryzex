name: Build Kryzex

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      - name: Build
        run: |
          sed -i '/org.gradle.java.home/d' gradle.properties || true
          chmod +x gradlew
          ./gradlew build --no-daemon --stacktrace
          ls -la build/libs

      - name: Ban thuong
        uses: actions/upload-artifact@v4
        with:
          name: kryzex-normal
          path: |
            build/libs/kryzex-*.jar
            !build/libs/*-obf.jar
            !build/libs/*-sources.jar

      - name: Ban obf
        uses: actions/upload-artifact@v4
        with:
          name: kryzex-obf
          path: |
            build/libs/*-obf.jar
            build/libs/mapping.txt
