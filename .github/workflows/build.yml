name: Build Kryzex

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Giai nen
        run: |
          unzip -q *.zip -d /tmp/src
          SRCDIR=$(find /tmp/src -name "gradlew" -type f | head -1 | xargs dirname)
          echo "SRCDIR=$SRCDIR" >> $GITHUB_ENV

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      - name: Build
        working-directory: ${{ env.SRCDIR }}
        run: |
          sed -i '/org.gradle.java.home/d' gradle.properties || true
          chmod +x gradlew
          ./gradlew build --no-daemon --stacktrace
          ls -la build/libs

      - name: Ban thuong
        uses: actions/upload-artifact@v4
        with:
          name: kryzex-normal
          path: |
            ${{ env.SRCDIR }}/build/libs/kryzex-*.jar
            !${{ env.SRCDIR }}/build/libs/*-obf.jar
            !${{ env.SRCDIR }}/build/libs/*-sources.jar

      - name: Ban obf
        uses: actions/upload-artifact@v4
        with:
          name: kryzex-obf
          path: |
            ${{ env.SRCDIR }}/build/libs/*-obf.jar
            ${{ env.SRCDIR }}/build/libs/mapping.txt
